<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Alebrijes Teotihuacán · Mensualidad</title>
  <meta name="description" content="Gestión de jugadores y mensualidades - Alebrijes Teotihuacán" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/styles.css" />

  <script type="module" src="js/app.js" defer></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-950 font-sans antialiased">

  <!-- Skip link para teclado -->
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <!-- ============== HEADER ============== -->
  <header class="site-header">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <a href="#/dashboard" class="flex items-center gap-2.5" aria-label="Ir al inicio">
        <img src="assets/logo.png" alt="" class="h-7 w-7 rounded-md object-cover" />
        <span class="text-sm font-semibold tracking-tight">Alebrijes Cobranza</span>
      </a>

      <nav class="hidden sm:flex items-center gap-0.5" id="nav-desktop" aria-label="Navegación principal">
        <a href="#/dashboard" data-route="dashboard" class="nav-link">Dashboard</a>
        <a href="#/players"   data-route="players"   class="nav-link">Jugadores</a>
        <a href="#/payments"  data-route="payments"  class="nav-link">Pagos</a>
        <a href="#/stats"     data-route="stats"     class="nav-link">Estadísticas</a>
        <a href="#/categories" data-route="categories" class="nav-link">Categorías</a>
      </nav>

      <button id="hamburger" type="button" class="sm:hidden icon-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-mobile">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/></svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="nav-mobile" class="sm:hidden border-t border-zinc-200 bg-white" hidden>
      <nav class="flex flex-col px-4 py-2 gap-0.5" aria-label="Navegación móvil">
        <a href="#/dashboard" data-route="dashboard" class="nav-link">Dashboard</a>
        <a href="#/players"   data-route="players"   class="nav-link">Jugadores</a>
        <a href="#/payments"  data-route="payments"  class="nav-link">Pagos</a>
        <a href="#/stats"     data-route="stats"     class="nav-link">Estadísticas</a>
        <a href="#/categories" data-route="categories" class="nav-link">Categorías</a>
      </nav>
    </div>
  </header>

  <!-- ============== MAIN ============== -->
  <main id="main" tabindex="-1" class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12"></main>

  <!-- ============== FOOTER ============== -->
  <footer class="mt-16 border-t border-zinc-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-xs text-zinc-500">
      <p>© <span id="year"></span> Alebrijes Teotihuacán</p>
    </div>
  </footer>

  <!-- ============== MODAL ROOT ============== -->
  <div id="modal-root"></div>

  <!-- ============== TOAST ROOT ============== -->
  <div id="toast-root" role="status" aria-live="polite" aria-atomic="false" class="toast-root"></div>

  <!-- ============== LIBS ============== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
