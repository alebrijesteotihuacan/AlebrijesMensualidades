<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0E1A" />
  <title>Alebrijes Teotihuacán · Mensualidad</title>
  <meta name="description" content="Gestión de jugadores y mensualidades - Alebrijes Teotihuacán" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Big Shoulders Display"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            /* Naranja Alebrije — primario vivo */
            brand: {
              50:  '#FFF4EA',
              100: '#FFE2C7',
              200: '#FFC089',
              300: '#FF9A4D',
              400: '#FF7B1A',
              500: '#F26B1F',  // principal
              600: '#D4540F',
              700: '#A73F0A',
              800: '#7A2D07',
              900: '#4D1C04',
            },
            /* Azul metálico institucional */
            steel: {
              50:  '#EEF3F8',
              100: '#D5E0EC',
              200: '#A8BFD9',
              300: '#7A9DC2',
              400: '#4F7AAB',
              500: '#345C85',
              600: '#1E3A5F',  // principal
              700: '#142A47',
              800: '#0A1A30',
              900: '#050D1A',
            },
            /* Negro profundo con tinte azulado */
            ink: {
              50:  '#F4F5F7',
              100: '#E2E5EB',
              200: '#C4C9D3',
              300: '#9CA4B5',
              400: '#6B7388',
              500: '#4B5266',
              600: '#2E3445',
              700: '#1A1F2E',
              800: '#10141F',
              900: '#0A0E1A',
            },
          },
          boxShadow: {
            soft: '0 1px 2px rgba(10,14,26,.04), 0 8px 24px rgba(10,14,26,.06)',
            metallic: '0 1px 0 rgba(255,255,255,.06) inset, 0 -1px 0 rgba(10,14,26,.12) inset, 0 10px 30px -10px rgba(10,14,26,.35)',
            ring: '0 0 0 4px rgba(242,107,31,.18)',
            cromo: '0 1px 0 rgba(255,255,255,.18) inset, 0 -1px 0 rgba(10,14,26,.4) inset',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/styles.css" />

  <script type="module" src="js/app.js" defer></script>
</head>
<body class="min-h-screen bg-ink-50 text-ink-900 font-sans antialiased">

  <!-- Skip link para teclado -->
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <!-- ============== HEADER ============== -->
  <header class="site-header">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <a href="#/dashboard" class="flex items-center gap-3 group" aria-label="Ir al inicio">
        <span class="logo-mark" aria-hidden="true">
          <img src="assets/logo.png" alt="" class="h-full w-full object-cover" />
        </span>
        <span class="leading-tight">
          <span class="block font-display font-extrabold text-base sm:text-lg tracking-tight">Alebrijes Teotihuacán</span>
          <span class="block text-[10px] sm:text-xs uppercase tracking-[0.18em] text-ink-500 font-semibold">Gestión de Mensualidades</span>
        </span>
      </a>

      <nav class="hidden md:flex items-center gap-1" id="nav-desktop" aria-label="Navegación principal">
        <a href="#/dashboard" data-route="dashboard" class="nav-link">Dashboard</a>
        <a href="#/players"   data-route="players"   class="nav-link">Jugadores</a>
        <a href="#/payments"  data-route="payments"  class="nav-link">Pagos</a>
      </nav>

      <button id="hamburger" class="md:hidden icon-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-mobile">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="nav-mobile" class="md:hidden border-t border-ink-200 bg-white" hidden>
      <nav class="flex flex-col p-2 gap-1" aria-label="Navegación móvil">
        <a href="#/dashboard" data-route="dashboard" class="nav-link">Dashboard</a>
        <a href="#/players"   data-route="players"   class="nav-link">Jugadores</a>
        <a href="#/payments"  data-route="payments"  class="nav-link">Pagos</a>
      </nav>
    </div>
  </header>

  <!-- ============== MAIN ============== -->
  <main id="main" tabindex="-1" class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8"></main>

  <!-- ============== FOOTER ============== -->
  <footer class="site-footer mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 text-xs text-ink-500 flex items-center justify-between gap-3">
      <p>© <span id="year"></span> Alebrijes Teotihuacán · Profesor Haziel Macias</p>
      <p class="hidden sm:flex items-center gap-2"><span class="font-display font-bold tracking-wider">ALE</span><span class="font-display font-bold tracking-wider">TDP</span></p>
    </div>
  </footer>

  <!-- ============== MODAL ROOT ============== -->
  <div id="modal-root"></div>

  <!-- ============== TOAST ROOT ============== -->
  <div id="toast-root" role="status" aria-live="polite" aria-atomic="false" class="toast-root"></div>

  <!-- ============== LIBS ============== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
